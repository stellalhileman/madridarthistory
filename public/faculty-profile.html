    .faculty-publications { padding-left: 1.3rem; line-height: 1.8; }
    .faculty-publications li + li { margin-top: .75rem; }
    @media (max-width: 700px) {
      .faculty-detail-page { padding: 2rem 20px 4rem; }
      .faculty-detail { grid-template-columns: 1fr; gap: 1.5rem; }
      .faculty-detail-image { max-width: 360px; }
